name: Validate documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Run AI-SRE single-neuron unit tests
        run: python -m unittest discover -s labs/ai-for-sre/single-neuron -p 'test_*.py' -v
      - name: Run AI-SRE tokenization unit tests
        run: python -m unittest discover -s labs/ai-for-sre/tokenization -p 'test_*.py' -v
