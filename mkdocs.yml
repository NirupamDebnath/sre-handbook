site_name: SRE Handbook
site_description: A practical learning and interview-preparation handbook for senior SRE and platform engineering.
site_url: https://nirupamdebnath.github.io/sre-handbook/
repo_name: NirupamDebnath/sre-handbook
repo_url: https://github.com/NirupamDebnath/sre-handbook
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  features:
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/compact-readability.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - About: about.md
      - Learning roadmap: learning-roadmap.md
  - Fundamentals:
      - Overview: fundamentals/index.md
      - SRE principles: fundamentals/sre-principles.md
      - SLIs, SLOs and SLAs: fundamentals/sli-slo-sla.md
      - Error budgets and alerts: fundamentals/error-budgets.md
      - Incident management: fundamentals/incident-management.md
  - Foundations:
      - Linux troubleshooting:
          - Overview: linux/index.md
          - Performance Monitoring:
              - Command Guide (top, ps, free, vmstat, iostat): linux/system-monitoring.md
      - Networking: networking/index.md
      - Python automation: python/index.md
      - Containers: containers/index.md
  - Cloud and Kubernetes:
      - AWS foundations: aws/index.md
      - Kubernetes operations: kubernetes/index.md
      - EKS operations: eks/index.md
      - Security: security/index.md
  - Delivery and IaC:
      - Terraform: terraform/index.md
      - CI/CD: cicd/index.md
      - GitOps: gitops/index.md
  - Observability: observability/index.md
  - AI for SRE:
      - Overview: ai-for-sre/index.md
      - AI Fundamentals:
          - Overview: ai-for-sre/fundamentals/index.md
          - AI, ML and Deep Learning: ai-for-sre/fundamentals/ai-ml-deep-learning.md
          - Neural Networks: ai-for-sre/fundamentals/neural-networks.md
          - Transformers and Attention: ai-for-sre/fundamentals/transformers-attention.md
          - Tokens and Tokenization: ai-for-sre/fundamentals/tokens-and-tokenization.md
      - Hands-on Labs:
          - Incident Assistant Design: ai-for-sre/labs/incident-assistant-design.md
          - Single Neuron Python Lab: ai-for-sre/labs/single-neuron.md
          - Transformer Flow Design: ai-for-sre/labs/transformer-flow.md
          - Tokenization Inspection Lab: ai-for-sre/labs/tokenization.md
      - Assessments:
          - Learning Progress: ai-for-sre/assessments/progress.md
          - Knowledge Check Answer Keys: ai-for-sre/assessments/answer-keys.md
  - Architecture:
      - System design: system-design/index.md
      - Platform engineering: platform-engineering/index.md
  - Hands-on labs: hands-on-labs/index.md
  - Interview preparation:
      - Overview: interview-prep/index.md
      - Linux: interview-prep/linux.md
      - AWS and EKS: interview-prep/aws.md
      - Kubernetes: interview-prep/kubernetes.md
      - Observability: interview-prep/observability.md
      - Scenarios: interview-prep/scenario-based.md
      - Leadership: interview-prep/behavioral-and-leadership.md
  - Reference:
      - Glossary: glossary.md
      - References: references.md

copyright: "Content is educational and sanitized; verify production decisions against current vendor documentation."
